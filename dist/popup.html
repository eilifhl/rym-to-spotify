<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYM Extractor</title>
  <script type="module" crossorigin src="./popup.js"></script>
  <link rel="modulepreload" crossorigin href="./types.js">
  <link rel="stylesheet" crossorigin href="./popup.css">
</head>
<body>
    <header>
        <h3>RYM to Spotify</h3>
        <div id="auth-indicator" class="status-dot disconnected"></div>
    </header>

    <main>
        <!-- Auth Section -->
        <div id="authSection" class="section">
            <button id="loginBtn" class="btn primary-btn">Connect Spotify</button>
            <button id="logoutBtn" class="btn secondary-btn" style="display:none;">Disconnect</button>
            <div id="authStatus" class="status-text">Checking connection...</div>
        </div>

        <!-- Options Section (Hidden by default) -->
        <div id="linkOptionsDiv" class="section options-box" style="display:none;">
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="linkType" value="album" checked>
                    <span>Albums</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="linkType" value="allTracks">
                    <span>All Tracks</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="linkType" value="firstTrack">
                    <span>First Track</span>
                </label>
            </div>
        </div>

        <!-- Action Section -->
        <div class="section">
            <button id="getLinksBtn" class="btn action-btn" disabled>Get Links</button>
        </div>

        <!-- Results Section -->
        <div class="section results-section">
            <textarea id="linksArea" readonly placeholder="Links will appear here..."></textarea>
            <button id="copyLinksBtn" class="btn copy-btn" disabled>Copy to Clipboard</button>
            <div id="status" class="status-text"></div>
        </div>
    </main>

</body>
</html>
